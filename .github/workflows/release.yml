name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true
      - name: Verify repository
        run: make verify

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="${GITHUB_SHA}"
          SUFFIX=""
          if [[ "${{ matrix.goos }}" == windows ]]; then SUFFIX=.exe; fi
          OUT="security-agent-suite_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "dist/${OUT}"
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -trimpath -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT}" \
            -o "dist/${OUT}/sasd${SUFFIX}" ./cmd/sasd
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -trimpath -ldflags "-s -w" -o "dist/${OUT}/sasctl${SUFFIX}" ./cmd/sasctl
          cp README.md LICENSE NOTICE "dist/${OUT}/"
          if [[ "${{ matrix.goos }}/${{ matrix.goarch }}" == linux/arm64 ]]; then
            cp agent-compose.yml release-manifest.json .env.example "dist/${OUT}/"
            printf '%s\n' 'Verified agent-compose runtime artifact: linux/arm64.' > "dist/${OUT}/RUNTIME_SCOPE.txt"
          else
            printf '%s\n' 'Client/mock-only artifact: agent-compose runtime is not verified for this platform; release-manifest.json is intentionally omitted.' > "dist/${OUT}/RUNTIME_SCOPE.txt"
          fi
          cp -R configs agents contracts openapi "dist/${OUT}/"
          if [[ "${{ matrix.goos }}" == windows ]]; then
            (cd dist && zip -qr "${OUT}.zip" "${OUT}")
          else
            tar -C dist -czf "dist/${OUT}.tar.gz" "${OUT}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: release-zip-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.zip
          if-no-files-found: ignore

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - run: sha256sum release-assets/* > release-assets/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
